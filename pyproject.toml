[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PPT_local_translator"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
  "python-pptx==1.0.2",
  "requests==2.32.3",
]

[tool.setuptools.packages.find]
include = ["ppt_local_translator*"]


[tool.pytest.ini_options]
markers = [
  "e2e: end-to-end tests requiring local services",
]
